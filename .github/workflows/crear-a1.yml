name: Crear instancias A1 en Oracle

# Cada ejecucion intenta durante ~25 minutos (un intento por minuto) y al
# terminar lanza la siguiente. El cron de GitHub es poco confiable (puede
# saltarse horas), asi que solo queda de respaldo por si la cadena se corta.
on:
  schedule:
    - cron: '17 * * * *'      # respaldo: una vez por hora
  workflow_dispatch:
    inputs:
      intentos:
        description: 'Intentos en esta ejecucion (uno por minuto)'
        required: false
        default: '25'

permissions:
  contents: read
  actions: write              # para lanzar la siguiente ejecucion y apagar el workflow

concurrency:
  group: crear-a1
  cancel-in-progress: false

jobs:
  crear:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Instalar OCI CLI
        run: pipx install oci-cli

      - name: Configurar credenciales
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          mkdir -p ~/.oci ~/.ssh
          printf '%s\n' "$OCI_KEY" > ~/.oci/oci_api_key.pem
          printf '%s\n' "$SSH_PUBLIC_KEY" > ~/.ssh/id_instancias.pub
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY
          region=sa-bogota-1
          key_file=~/.oci/oci_api_key.pem
          EOF
          chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem

      - name: Intentar crear las instancias
        id: crear
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOMBRES: 'MiTv Alexa'
          OCPUS: '2'
          MEMORIA_GB: '12'
          INTENTOS: ${{ inputs.intentos || '25' }}
          ESPERA: '60'
        run: bash crear-a1.sh

      - name: Lanzar la siguiente ejecucion
        if: success() && steps.crear.outputs.terminado != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run crear-a1.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"

      - name: Apagar este workflow (terminado o error de configuracion)
        if: always() && (steps.crear.outputs.terminado == '1' || steps.crear.outputs.pausar == '1')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable crear-a1.yml --repo "${{ github.repository }}"
